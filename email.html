<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOAH Email</title>
<base target="_blank">
<link rel="stylesheet" href="style.css?v=11">
<link rel="icon" href="img/icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="woah.css?v=4">
<script src="theme.js?v=5"></script>
</head>
<body>
<div class="wrap">
  <div id="login" class="card"></div>
  <div id="app">
  <header>
    <div>
      <a class="back" href="handlers.html" target="_self">← Back to Email handlers</a>
      <h1 style="margin-top:6px"><span>WOAH</span> Email</h1>
      <div class="sub" id="updated">Loading…</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><nav class="pages" id="nav"></nav><button id="refresh" onclick="load()" target="_self">Refresh</button></div>
      <div class="who" id="who"></div>
    </div>
  </header>
  <div class="banner" id="banner"></div>
  <div id="main"></div>
  <div style="margin-top:16px"><a class="back btnlike" href="handlers.html" target="_self">← Back to Email handlers</a></div>
  </div>
</div>
<script src="common.js?v=5"></script>
<script src="handle.js?v=11"></script>
<script>
  const ID = (new URLSearchParams(location.search).get('id') || '').replace(/[^0-9a-f]/gi, '');

  function render(d) {
    DATA = d;
    const s = d.snap, me = myEmail();
    document.getElementById('updated').textContent = s ? 'Inbox checked ' + when(s.at) + ' · page loaded ' + when(d.now) : 'No inbox data yet';
    const b = document.getElementById('banner');
    if (d.control && d.control.inbox === 'BREAK') { b.className = 'banner warn'; b.textContent = 'The WOAH inbox is on BREAK: forwards and reminders go to the break contacts, not the team.'; }
    else { b.className = 'banner'; b.textContent = ''; }
    const main = document.getElementById('main');
    const f = findItem(ID);
    if (!f) {
      main.innerHTML = `<div class="card"><div class="empty">This email isn't on the lists any more. It may have been answered, marked done or sorted.</div></div>` + convoCard(d.thread);
      return;
    }
    const x = f.x, them = f.kind === 'them', dd = days(x.since);
    let h = `<div class="card">
      <div class="sub">${them ? 'Waiting on them · WOAH sent this and is waiting for an answer' : 'To answer · someone emailed WOAH and is waiting for us'}</div>
      <h2 class="subject">${esc(x.subject)}</h2>
      <div class="meta">${them ? themMeta(x) : usMeta(x)} · <span class="${ageClass(x.since, them ? 7 : 3, them ? 12 : 5)}">${dd === 0 ? 'today' : dd + (dd === 1 ? ' day' : ' days')}</span></div>
      <div style="margin-top:6px">${them ? themTags(x, me) : usTags(x, me)} <a class="mine" href="${esc(mineLink(x))}">find in my email</a></div>
      ${them ? '' : flagHtml(x)}${pendHtml(x, them)}
      ${sending(x) ? `<div class="sentlbl" style="margin-top:8px">Sent, waiting for Chris to confirm. Nothing else to do here.</div>` : them ? themButtons(x, me, true) : usButtons(x, me, true)}
      <div class="confirm" id="hc-${x.id}"></div>
    </div>`;
    h += composerCard(x, them);
    h += convoCard(d.thread);
    main.innerHTML = h;
    if (/^#(followup|reply)$/.test(location.hash)) { const c = document.getElementById('compose'); if (c) c.scrollIntoView(); }
  }

  // ---------- reply / follow-up: Chris suggests one (or start blank), the student edits it, then sends it from the WOAH email ----------
  function composerCard(x, them) {
    const op = them ? 'followup' : 'reply', title = them ? 'Follow up' : 'Reply';
    const dr = DRAFTS[x.id];
    const to = esc((them ? x.who : x.from) || 'them');
    let body;
    if (sending(x) || (dr && dr.sent)) body = `<div class="okbox">Your ${them ? 'follow-up' : 'reply'} is on its way: Chris sends it from the WOAH email within about 5 minutes and emails you a copy.</div>`;
    else if (!dr) body = `<div class="sub" style="margin-bottom:6px">Write the ${them ? 'follow-up' : 'reply'} yourself, or let Chris suggest one${them ? ' from the conversation' : ' from the conversation and the WOAH files in Drive'}.</div>
      <div class="hact"><button class="primary" onclick="suggest('${x.id}')">Suggest a ${them ? 'follow-up' : 'reply'} with Chris</button><button onclick="blank('${x.id}')">Write my own</button></div>`;
    else if (dr.loading) body = `<div class="sub">Chris is reading the conversation${them ? '' : ' and the WOAH files in Drive'} and writing a suggestion…</div>
      <div class="hact"><button onclick="blank('${x.id}')">Write my own instead</button></div>`;
    else body = `<div class="sub" style="margin-bottom:6px">${dr.blank ? 'Write your ' + (them ? 'follow-up' : 'reply') + ' below.' : dr.ai ? 'Suggested by Chris. Check it and change anything you like.' : 'A simple template (the AI suggestion wasn\'t available).'} It's sent to <b>${to}</b> exactly as written, from the WOAH email.${them && x.own ? ` ${esc(x.owners || 'The team member')} first sent this from their own email, so they're copied in.` : ''}</div>
      ${dr.waitingFor ? `<div class="waitfor">What we're waiting for: <b>${esc(dr.waitingFor)}</b></div>` : ''}
      ${dr.asking ? `<div class="waitfor">What they're asking: <b>${esc(dr.asking)}</b></div>` : ''}
      ${(dr.check || []).length ? `<div class="checkbox"><b>Check before sending</b><ul>${dr.check.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>` : ''}
      <textarea class="compose" id="draft" oninput="DRAFTS['${x.id}'].text=this.value" ${dr.polishing ? 'disabled' : ''}>${esc(dr.text)}</textarea>
      ${dr.blank ? `<div class="hact polish" style="align-items:center"><button onclick="polish('${x.id}')" ${dr.polishing ? 'disabled' : ''}>${dr.polishing ? 'Improving…' : 'Improve my text'}</button>${dr.before != null && !dr.polishing ? `<button onclick="unpolish('${x.id}')">Undo</button>` : ''}<span class="sub">${dr.polishing ? 'Chris is fixing the grammar and wording…' : dr.polishErr ? esc(dr.polishErr) : dr.before != null ? 'Chris tidied the grammar and wording. Nothing else was changed, but read it once before sending.' : 'Chris fixes the grammar and makes it sound professional, without changing what you wrote.'}</span></div>` : ''}
      ${(dr.used || []).length ? `<div class="sub" style="margin-top:4px">Facts taken from: ${esc(dr.used.join(', '))}</div>` : ''}
      <div class="sub" style="margin-top:4px">Anything in [square brackets] is a gap Chris couldn't fill: replace it before sending.</div>
      <div class="hact"><button class="primary" onclick="act('${x.id}','${op}')">Send from the WOAH email</button><button onclick="suggest('${x.id}')">${dr.blank ? 'Suggest with Chris' : 'Write a new suggestion'}</button><button onclick="blank('${x.id}')">Start blank</button></div>
      ${them ? '' : `<div class="sub" style="margin-top:8px">You can still reply from Chris's forward in your own inbox instead, as usual.</div>`}`;
    return `<div class="card" id="compose" style="margin-top:14px"><b>${title}</b>${body}</div>`;
  }
  function redrawComposer(id) {
    const g = findItem(id), c = document.getElementById('compose');
    if (g && c) c.outerHTML = composerCard(g.x, g.kind === 'them');
  }
  function blank(id) {
    const g = findItem(id); if (!g) return;
    const name = myEmail() ? teamName(myEmail()) : '';
    DRAFTS[id] = { text: `Hi ,\n\n\n\nBest,\n${name}\nWOAH Festival Team`, blank: true, ai: false };
    redrawComposer(id);
  }
  // "Improve my text": only for a reply they wrote themselves. Chris fixes grammar and tone, keeps every fact.
  function polish(id) {
    const dr = DRAFTS[id]; if (!dr || !dr.blank || dr.polishing) return;
    const t = document.getElementById('draft'); if (t) dr.text = t.value;
    const own = dr.text.split('\n').filter(l => !/^\s*(hi\s*,?|best,?|woah festival team)\s*$/i.test(l) && l.trim() !== (myEmail() ? teamName(myEmail()) : '')).join(' ').trim();
    if (own.length < 15) { dr.polishErr = 'Write your message first, then press Improve my text.'; redrawComposer(id); return; }
    const g = findItem(id);
    dr.polishing = true; dr.polishErr = ''; redrawComposer(id);
    call({ action: 'polish', id, text: dr.text, kind: g && g.kind === 'them' ? 'followup' : 'reply' }).then(r => {
      if (DRAFTS[id] !== dr) return;   // they switched to a Chris suggestion meanwhile
      dr.polishing = false;
      if (r.text) { dr.before = dr.text; dr.text = r.text; }
      redrawComposer(id);
    }).catch(err => { if (DRAFTS[id] !== dr) return; dr.polishing = false; dr.polishErr = err.message; redrawComposer(id); });
  }
  function unpolish(id) { const dr = DRAFTS[id]; if (!dr || dr.before == null) return; dr.text = dr.before; dr.before = null; redrawComposer(id); }
  function sending(x) { return ((DATA.pending || []).some(a => a.id === x.id && ['reply', 'followup', 'done'].includes(a.op))); }
  function suggest(id) {
    DRAFTS[id] = { loading: true };
    redrawComposer(id);
    call({ action: 'draft', id }).then(r => {
      if (!DRAFTS[id] || !DRAFTS[id].loading) return;   // they chose to write their own meanwhile
      DRAFTS[id] = { text: r.draft || '', ai: !!r.ai, waitingFor: r.waitingFor || '', asking: r.asking || '', check: r.check || [], used: r.used || [] };
      redrawComposer(id);
    }).catch(err => { DRAFTS[id] = { text: '', ai: false, check: [err.message] }; redrawComposer(id); });
  }

  // ---------- the whole conversation, oldest first ----------
  function convoCard(t) {
    if (!t || !(t.msgs || []).length) return `<div class="card" style="margin-top:14px"><b>The email</b><div class="sub" style="margin-top:4px">The full email isn't ready yet (Chris saves it within the hour). Use "find in my email" to read it in Gmail.</div></div>`;
    const more = t.count > t.msgs.length ? `<div class="sub">Showing the last ${t.msgs.length} of ${t.count} emails in this conversation.</div>` : '';
    return `<div class="card" style="margin-top:14px"><b>The email</b>${more}` + t.msgs.map((m, i) => `
      <div class="msg ${m.us ? 'us' : ''} ${i === t.msgs.length - 1 ? 'last' : ''}">
        <div class="mhead"><b>${esc(m.us ? 'WOAH Festival' : m.from)}</b> <span class="sub">${m.us ? '' : '&lt;' + esc(m.email) + '&gt;'} · ${esc(when(m.at))}</span></div>
        <div class="body">${esc(m.text || '(no text)')}</div>
        ${(m.files || []).length ? `<div class="sub">Attached: ${esc(m.files.join(', '))}</div>` : ''}
      </div>`).join('') + `</div>`;
  }

  window.afterAct = d => { d.thread = DATA.thread; d.id = DATA.id; render(d); };
  if (!ID) document.getElementById('main').innerHTML = '<div class="card"><div class="empty">No email picked. Go back to the Email handlers page.</div></div>';
  start({ title: 'Email', need: 'handler', action: 'thread', params: { id: ID }, onData: render });
</script>
</body>
</html>
