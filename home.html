<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOAH Student Dashboard</title>
<base target="_blank">
<link rel="stylesheet" href="style.css?v=12">
<link rel="icon" href="img/icon.png?v=2">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="img/app/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WOAH">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="woah.css?v=7">
<link rel="stylesheet" href="ledger.css?v=2">
<link rel="stylesheet" href="tide.css?v=3">
<link rel="stylesheet" href="phone.css?v=4">
<script src="theme.js?v=11"></script>
<style>
  .h-hi { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .h-hi h2 { margin: 0 0 4px; font-size: 24px; }
  .h-hi p { margin: 0; color: var(--muted); font-size: 14px; }
  .h-go { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .h-go a, .h-go button { display: flex; flex-direction: column; gap: 3px; margin: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); text-decoration: none; text-align: left; font: inherit; cursor: pointer; transition: border-color .15s, transform .15s; }
  .h-go a:hover, .h-go button:hover { border-color: var(--brand); transform: translateY(-1px); }
  .h-go b { font-size: 15px; }
  .h-go small { color: var(--muted); font-size: 12px; line-height: 1.3; }
  .h-pulse { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .h-pulse div { padding: 10px 12px; border-radius: 10px; background: var(--bg); }
  .h-pulse b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .h-pulse span { color: var(--muted); font-size: 12px; }
  .h-bar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--bg); margin: 6px 0 8px; }
  .h-bar i { display: block; height: 100%; min-width: 3px; }
  .h-key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
  .h-key span { display: inline-flex; align-items: center; gap: 5px; }
  html.m .h-hi h2 { font-size: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="card"></div>
  <div id="app">
  <header>
    <div>
      <h1><span>WOAH</span> Student Dashboard</h1>
      <div class="sub" id="updated">Loading…</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><nav class="pages" id="nav"></nav><button id="refresh" onclick="load()" target="_self">Refresh</button></div>
      <div class="who" id="who"></div>
    </div>
  </header>
  <div class="banner" id="banner"></div>
  <div class="h-hi"><div><h2 id="hi">Hi!</h2><p id="hiLine"></p></div></div>
  <div class="grid stats" id="stats"></div>
  <div class="h-two">
    <div class="card" id="emails"></div>
    <div class="card" id="tasks"></div>
  </div>
  <div class="h-two">
    <div class="card" id="go"></div>
    <div class="card" id="partners"></div>
  </div>
  <div class="card" id="team" style="margin-bottom:14px"></div>
  <div class="card" id="pulse"></div>
  </div>
</div>
<script src="common.js?v=15"></script>
<script src="extras.js?v=3"></script>
<script src="phone.js?v=7"></script>
<script src="home.js?v=2"></script>
<script>
  function greet() { const h = new Date().getHours(); return h < 11 ? 'Good morning' : h < 17 ? 'Hi' : 'Good evening'; }
  function render(d) {
    if (d.me && d.me.role === 'full') { location.replace('./'); return; }   // admins have all of this on the Dashboard
    HD = d;
    const s = d.snap, m = hMine(), tasks = d.tasks || [], over = tasks.filter(x => x.overdue).length;
    document.getElementById('updated').textContent = (s ? 'Emails checked ' + when(s.at) + ' · ' : '') + 'page loaded ' + when(d.now);
    const b = document.getElementById('banner');
    if (!s) { b.className = 'banner warn'; b.textContent = 'Chris hasn\'t shared any email data yet. Try Refresh in a few minutes.'; } else { b.className = 'banner'; b.textContent = ''; }
    const meP = hPerson(myEmail());
    document.getElementById('hi').textContent = greet() + ', ' + (meP ? hShort(meP) : String((ME && ME.name) || '').split(' ')[0]);
    const bits = [];
    if (m.us.length) bits.push(hPlural(m.us.length, 'email') + ' to answer');
    if (over) bits.push(hPlural(over, 'Planner item') + ' overdue');
    document.getElementById('hiLine').textContent = bits.length ? 'You have ' + bits.join(' and ') + '.' : 'Nothing urgent on your plate right now. Nice.';
    const oldUs = m.us.filter(x => days(x.since) >= 3).length;
    const tiles = [
      { n: m.us.length, l: 'Emails for me to answer' + (oldUs ? ' · ' + oldUs + ' over 3 days' : ''), c: oldUs ? 'bad' : 'brand', href: 'handlers.html' },
      { n: m.them.length, l: "Emails I'm chasing", c: 'warn', href: 'handlers.html' },
      { n: tasks.length, l: 'My Planner items' + (over ? ' · ' + over + ' overdue' : ''), c: over ? 'bad' : 'brand', href: '#tasks' },
      { n: d.myPartnersAll || 0, l: "Partners I'm PIC for", c: 'brand', href: '#partners' },
    ];
    document.getElementById('stats').innerHTML = tiles.map(t => `<a class="card stat ${t.c}" href="${t.href}" target="_self" style="text-decoration:none;color:inherit"><div class="n">${t.n}</div><div class="l">${t.l}</div></a>`).join('');
    hEmails('emails'); hTasks('tasks'); hPartners('partners'); hTeam('team');
    const go = [
      ['handlers.html', 'Emails', 'Answer, claim or pass on emails'],
      ['partners.html', 'Partners', 'Search every sponsor and contact'],
      ['pipeline.html', 'Pipeline', 'Sponsors by stage'],
      ['sell.html', 'POS', 'Sell merch at the stand'],
      ['stock.html', 'Stock', "What's left, per size"],
    ];
    document.getElementById('go').innerHTML = `<div class="h-card-h"><h3>Go to</h3></div><div class="h-go">` +
      go.map(([h, t, s]) => `<a href="${h}" target="_self"><b>${t}</b><small>${s}</small></a>`).join('') +
      `<button type="button" onclick="askChris()"><b>Ask Chris</b><small>Questions about WOAH, files and emails</small></button></div>`;
    const P = d.pulse || {}, pos = P.pos, pt = P.partners;
    const cells = [[P.open || 0, 'Emails waiting on WOAH'], [P.waiting || 0, 'Waiting on outside people'], [P.overdue || 0, 'Planner items overdue (team)']];
    if (pos) cells.push([pos.items, 'Items sold today' + (pos.mine ? ' · ' + pos.mine + ' by you' : '')]);
    let bar = '';
    if (pt && pt.total) {
      const st = pt.stages.filter(x => x.n);
      bar = `<div class="h-sec">Partners by stage · ${pt.total} contacts</div>
        <div class="h-bar" role="img" aria-label="Partners by stage">${st.map(x => `<i title="${esc(x.label)}: ${x.n}" style="width:${(x.n / pt.total * 100).toFixed(2)}%;background:${x.color ? esc(x.color) : 'var(--line-2, var(--line))'}"></i>`).join('')}</div>
        <div class="h-key">${st.map(x => `<span><span class="h-dot" style="${x.color ? 'background:' + esc(x.color) : ''}"></span>${esc(x.label)} <b>${x.n}</b></span>`).join('')}</div>`;
    }
    document.getElementById('pulse').innerHTML = `<div class="h-card-h"><h3>Team pulse</h3></div>
      <div class="h-pulse">${cells.map(([n, l]) => `<div><b>${n}</b><span>${l}</span></div>`).join('')}</div>${bar}
      <div class="h-note">The whole team at a glance. Read only.</div>`;
    if (H_OPEN) hRedraw();
    setTimeout(() => hTeam('team'), 2500);   // photos arrive a moment after the first load
  }
  function askChris() { const b = document.querySelector('.w-chat-btn'); if (b) b.click(); }
  window.hReload = () => load();
  start({ title: 'Student Dashboard', need: 'handler', action: 'home', every: 2, onData: render });
</script>
</body>
</html>
