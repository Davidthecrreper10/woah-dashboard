<!DOCTYPE html>
<html>
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&family=Public+Sans:wght@400;500;600;700&display=swap">

<style>
  /* No tap animations on this page: the till must feel instant (and the swap animation used to cover the Close button). */
  #view.w-swap, #view .w-swap, #view .w-row, #view .w-in, #sheet.w-swap, #sheet .w-swap, #sheet .w-row, #sheet .w-in, #side.w-swap, #side .w-swap, #side .w-row, #side .w-in, #tabs .w-row { animation: none !important; }

  /* tabs */
  .ps-tabs { display: flex; gap: 6px; margin: 4px 0 14px; overflow-x: auto; padding-bottom: 2px; }
  .ps-tabs button { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 12px; font-size: 15px; font-weight: 700; background: var(--card); color: var(--muted); border: 1px solid var(--line); }
  .ps-tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .ps-tabs .n { font-family: 'JetBrains Mono', monospace; font-size: 11px; background: var(--brand); color: var(--on-brand, #fff); border-radius: 999px; padding: 1px 7px; }
  .ps-q { display: none; margin: 0 0 12px; padding: 10px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: 14px; font-weight: 600; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ps-q.on { display: flex; }
  .ps-q button { font-size: 13px; padding: 5px 10px; }

  /* layout: catalogue + cart panel on wide screens */
  .ps-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; }
  .ps-layout.side { grid-template-columns: minmax(0, 1fr) 360px; }
  .ps-side { position: sticky; top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; max-height: calc(100vh - 24px); overflow: auto; }
  .ps-side h3 { margin: 0 0 6px; font-size: 17px; display: flex; justify-content: space-between; align-items: baseline; }
  .ps-side h3 small { font-size: 12px; color: var(--muted); font-weight: 500; }
  .ps-side .empty { color: var(--muted); font-size: 14px; padding: 18px 0; text-align: center; }
  @media (max-width: 980px) { .ps-layout.side { grid-template-columns: minmax(0, 1fr); } .ps-side { display: none; } }
  .ps-bar { display: none; }
  @media (max-width: 980px) {
    .ps-bar { display: flex; position: sticky; bottom: 0; z-index: 20; margin: 14px -4px 0; padding: 10px 64px calc(10px + env(safe-area-inset-bottom)) 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px 16px 0 0; box-shadow: 0 -6px 20px rgba(0,0,0,.12); align-items: center; gap: 10px; }
    .ps-bar .sum { flex: 1; font-size: 14px; } .ps-bar .sum b { font-family: 'JetBrains Mono', monospace; font-size: 17px; display: block; }
    .ps-bar button { font-size: 15px; padding: 12px 18px; }
  }

  /* toolbar + sections */
  .ps-tool { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 4px; }
  .ps-tool .search { flex: 1 1 200px; }
  .bseg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
  html body .bseg button { border: 0; background: none; padding: 7px 14px; border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
  html body .bseg button.on { background: var(--ink); color: var(--bg); }
  html body .ps-tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .ps-h { display: flex; align-items: baseline; gap: 8px; margin: 20px 0 10px; font-size: 12.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .ps-h b { font-family: 'JetBrains Mono', monospace; color: var(--ink); }
  .ps-h .line { flex: 1; height: 1px; background: var(--line); align-self: center; }
  .ps-note { font-size: 13.5px; color: var(--muted); margin: 6px 0 0; }

  /* product cards */
  .ps-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); }
  @media (max-width: 460px) { .ps-grid { grid-template-columns: 1fr 1fr; gap: 8px; } }
  .ps-p { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 0; overflow: hidden; display: flex; flex-direction: column; color: var(--ink); cursor: pointer; font: inherit; }
  .ps-p:hover { border-color: var(--brand); }
  .ps-p.out { opacity: .5; }
  .ps-p .im { aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; background: #0E3A4A; }
  .ps-p .im.soap { background: #1F4E8C; }
  .ps-p .im img { width: 100%; height: 100%; object-fit: cover; }
  .ps-p .im .nm { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px; line-height: 1.1; padding: 12px; text-align: center; color: #fff; text-transform: uppercase; letter-spacing: .01em; }
  .ps-p .tg { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 4px; flex-wrap: wrap; }
  .ps-p .tg span { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: rgba(255,255,255,.92); color: #04212F; }
  .ps-p .tg .pre { background: #FFE2B8; color: #7A4300; } .ps-p .tg .soap { background: #DDEBFF; color: #1F4E8C; }
  .ps-p .bd { padding: 9px 11px 11px; display: flex; flex-direction: column; gap: 3px; }
  .ps-p .t { font-weight: 700; font-size: 14.5px; line-height: 1.2; }
  .ps-p .m { display: flex; flex-direction: column; gap: 1px; font-size: 12.5px; }
  .ps-p .m b { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .ps-p .m span { color: var(--muted); }
  .sz { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .sz span { font: 600 11px 'JetBrains Mono', monospace; padding: 2px 6px; border-radius: 6px; background: var(--bg); color: var(--ink); }
  .sz span.z { color: var(--muted); text-decoration: line-through; opacity: .7; }

  /* sheets (picker, checkout, collect) */
  .ps-ov { position: fixed; inset: 0; background: rgba(4,33,47,.6); z-index: 1000; display: none; align-items: flex-end; justify-content: center; }
  .ps-ov.on { display: flex; }
  .ps-sh { background: var(--card); color: var(--ink); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 18px 18px 0; box-shadow: 0 -10px 40px rgba(0,0,0,.3); }
  @media (min-width: 700px) { .ps-ov { align-items: center; } .ps-sh { border-radius: 22px; } }
  .sh-h { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
  .sh-h .tt { flex: 1; min-width: 0; }
  .sh-h h2 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; line-height: 1.15; margin: 0; }
  .sh-h .sub { margin-top: 3px; }
  html body .sh-x { flex: none; width: 40px; height: 40px; border-radius: 50%; padding: 0; font-size: 20px; line-height: 1; display: flex; align-items: center; justify-content: center; position: relative; z-index: 3; }
  .sh-sec { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
  .sh-sec > .lbl { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .sh-f { position: sticky; bottom: 0; background: var(--card); margin: 14px -18px 0; padding: 12px 18px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: center; z-index: 2; }
  .sh-f .tot { flex: 1; font-size: 13px; color: var(--muted); } .sh-f .tot b { display: block; font-family: 'JetBrains Mono', monospace; font-size: 20px; color: var(--ink); }
  html body .btn-main { background: var(--brand); color: var(--on-brand, #fff); border-color: var(--brand); font-weight: 700; font-size: 16px; padding: 13px 20px; }
  html body .btn-main:disabled { opacity: .45; }
  .sh-f .btn-main { flex: 1.4; }
  .bigprice { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; margin-top: 6px; }
  .ps-lbl { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 14px 0 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 15px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); min-width: 54px; text-align: center; }
  .chip small { display: block; font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 1px; }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); } .chip.on small { color: inherit; opacity: .8; }
  .chip.zero small { color: var(--bad); }
  .chip:disabled { opacity: .3; }
  .qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; flex: none; }
  .qty button { border: 0; border-radius: 0; width: 40px; height: 40px; font-size: 18px; padding: 0; background: var(--bg); color: var(--ink); }
  .qty span { min-width: 34px; text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .qty.sm button { width: 30px; height: 30px; font-size: 15px; } .qty.sm span { min-width: 26px; font-size: 13px; }
  .ps-in { font: inherit; font-size: 16px; width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .ps-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .warnline { font-size: 13.5px; color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 8px 10px; margin-top: 10px; }
  .badline { font-size: 14px; color: var(--bad); font-weight: 600; margin-top: 8px; min-height: 1em; }
  /* cart lines */
  .cl { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .cl:last-child { border-bottom: 0; }
  .cl .ln { flex: 1; min-width: 0; font-size: 14.5px; } .cl .ln .o { font-size: 12.5px; color: var(--muted); }
  .cl .ctl { margin-top: 6px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cl .pr { font-family: 'JetBrains Mono', monospace; font-weight: 700; text-align: right; white-space: nowrap; font-size: 14px; }
  .cl .pr s { color: var(--muted); font-weight: 500; display: block; font-size: 12px; }
  .lnk { background: none !important; border: 0 !important; padding: 0 !important; color: var(--sea, var(--brand)); font-size: 13px; text-decoration: underline; }
  .disc { display: grid; grid-template-columns: 110px 1fr; gap: 6px; margin-top: 8px; } .disc .ps-in { font-size: 14px; padding: 8px 10px; }
  .side-tot { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0 10px; border-top: 2px solid var(--line); margin-top: 4px; font-weight: 800; }
  .side-tot b { font-family: 'JetBrains Mono', monospace; font-size: 20px; }
  .ps-side .btn-main { width: 100%; }
  /* payment */
  .pays { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .pays button { font-size: 14.5px; padding: 12px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-weight: 600; }
  .pays button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .payinfo { margin-top: 12px; text-align: center; }
  .payinfo img { width: min(240px, 66vw); border-radius: 12px; background: #fff; padding: 8px; border: 1px solid var(--line); }
  .payinfo .amt { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; margin: 8px 0 2px; }
  .payinfo .bank { white-space: pre-line; text-align: left; background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; }
  .change { font-size: 15px; margin-top: 8px; } .change b { font-family: 'JetBrains Mono', monospace; font-size: 24px; display: block; }
  .change.bad b { color: var(--bad); }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; } .quick button { font-size: 13px; padding: 6px 10px; }
  .photo { display: flex; gap: 12px; align-items: flex-start; margin-top: 14px; padding: 12px 14px; border-radius: 12px; border: 2px dashed var(--warn); background: var(--warn-soft); text-align: left; font-size: 15px; font-weight: 600; cursor: pointer; }
  .photo.ok { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
  .photo input { width: 24px; height: 24px; flex: none; margin: 0; }
  .photo small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .tick { display: flex; gap: 10px; align-items: center; margin-top: 12px; font-size: 15px; font-weight: 600; }
  .tick input { width: 22px; height: 22px; }
  .done-no { font-family: 'JetBrains Mono', monospace; font-size: 34px; font-weight: 700; text-align: center; margin: 10px 0; }
  /* lists */
  .ps-list { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
  @media (max-width: 420px) { .ps-list { grid-template-columns: 1fr; } }
  .oc { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .oc.cx { opacity: .6; } .oc.cx .it { text-decoration: line-through; }
  .oc .h { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .oc .h b { font-family: 'JetBrains Mono', monospace; }
  .oc .it { font-size: 13.5px; display: flex; justify-content: space-between; gap: 8px; }
  .oc .ft { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; align-items: center; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 12px; white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; font-weight: 700; }
  .pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; font-weight: 700; }
  .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; font-weight: 700; }
  .pill.soap { background: #DDEBFF; color: #1F4E8C; border-color: transparent; }
  .oc .acts { display: flex; gap: 6px; flex-wrap: wrap; } .oc .acts button { font-size: 13px; padding: 6px 10px; }
  .oc .acts .btn-main { font-size: 14px; padding: 8px 14px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
  .stat b { display: block; font-family: 'JetBrains Mono', monospace; font-size: 17px; }
  .ck { width: 100%; border-collapse: collapse; font-size: 14px; table-layout: fixed; }
  .ck td, .ck th { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: right; overflow-wrap: anywhere; }
  .ck th { font-size: 11px; } .ck td { font-size: 13px; }
  .ck td:first-child, .ck th:first-child { text-align: left; }
  .ck input { width: 100%; max-width: 140px; box-sizing: border-box; text-align: right; font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .ck .diff.bad { color: var(--bad); font-weight: 700; } .ck .diff.ok { color: var(--ok); font-weight: 700; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 1100; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s; max-width: calc(100% - 32px); }
  .toast.on { opacity: 1; }
</style>

<body>
<div class="wrap">
  <div id="login" class="card"></div>
  <div id="app">
  <header>
    <div>
      <h1><span>WOAH</span> Sell</h1>
      <div class="sub" id="updated">Loading…</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><nav class="pages" id="nav"></nav><button id="refresh" onclick="load()" target="_self">Refresh</button></div>
      <div class="who" id="who"></div>
    </div>
  </header>
  <div class="banner" id="banner"></div>
  <div class="ps-q" id="queue"></div>
  <div class="ps-tabs" id="tabs"></div>
  <div class="ps-layout" id="layout"><div id="view"></div><aside class="ps-side" id="side" style="display:none"></aside></div>
  </div>
</div>
<div class="ps-ov" id="ov" onclick="if(event.target===this)closeSheet()"><div class="ps-sh" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="common.js?v=8"></script>
<script src="extras.js?v=1"></script>
<script>
  /* ---------- state ---------- */
  const PAYS = [['cash', 'Cash'], ['qris', 'QRIS'], ['xendit', 'Card (Xendit)'], ['transfer', 'Transfer'], ['later', 'Not paid yet'], ['foc', 'FOC (free)']];
  const PAY_LABEL = { cash: 'CASH', qris: 'QRIS', xendit: 'CARD (XENDIT)', transfer: 'TRANSFER', later: 'NOT YET PAID', foc: 'FOC' };
  const PHOTO = ['qris', 'xendit', 'transfer'];
  const METHODS = ['CASH', 'QRIS', 'CARD (XENDIT)', 'TRANSFER', 'NOT YET PAID', 'FOC'];
  const COUNTED = ['CASH', 'QRIS', 'CARD (XENDIT)', 'TRANSFER'];
  const QRIS_IMG = '../woah-shop/img/qris.png', XENDIT_IMG = 'img/xendit-qr.png', XENDIT_LINK = 'https://checkout.xendit.co/od/25-26-HS-WOAH-Merchandise';
  let D = null, TAB = 'sell', BR = 'all', SQ = '', CART = [], PRE = [], PAY = null, DAY = null, DAYS = [], DAYSEL = '', ORD = null, OQ = '', BUSY = false, PICK = null, CK = {}, SHEET = '';
  const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  TAB = ls.get('woahPosTab', 'sell'); BR = ls.get('woahPosBrand', 'all'); CART = ls.get('woahPosCart', []); PRE = ls.get('woahPosPre', []);
  let QUEUE = ls.get('woahPosQueue', []);
  { const h = location.hash.replace('#', ''); if (['sell', 'pre', 'collect', 'today'].includes(h)) TAB = h; }
  if (TAB === 'pre') TAB = 'sell';
  if (PRE.length) { CART = CART.concat(PRE.map(l => Object.assign({}, l, { pre: true }))); PRE = []; }   /* old separate pre-order cart */

  function rp(n) { return 'Rp ' + Number(n || 0).toLocaleString('id-ID'); }
  function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }
  function uid(p) { return p + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7); }
  function brandOf(name) { return /soap/i.test(name || '') ? 'soap' : 'woah'; }
  function optText(l) { return [l.colour, l.fit, l.size].filter(Boolean).join(' · '); }
  function prod(k) { return D && D.products.find(p => p.key === k); }
  function variant(l) { const p = prod(l.key); return p && p.variants.find(v => (v.colour || '') === (l.colour || '') && (v.fit || '') === (l.fit || '') && (v.size || '') === (l.size || '')); }
  function linePrice(l) { if (l.custom) return Number(l.price) || 0; const v = variant(l); return v ? v.price : 0; }
  function lineFull(l) { return linePrice(l) * l.qty; }
  function lineNet(l) { return Math.max(0, lineFull(l) - (Number(l.discount) || 0)); }
  function cartFor() { return CART; }
  function saveCarts() { ls.set('woahPosCart', CART); ls.set('woahPosPre', PRE); }
  function totalOf(c) { return c.reduce((a, l) => a + lineNet(l), 0); }
  function countOf(c) { return c.reduce((a, l) => a + l.qty, 0); }
  /* stock left after this phone's own cart and unsent sales */
  function left(v) { return (Number(v.stock) || 0) - usedHere(v.item); }
  function stockOf(p) { return p.variants.reduce((a, v) => a + Math.max(0, left(v)), 0); }
  function priceOf(p) { const ps = p.variants.map(v => v.price).filter(Boolean); if (!ps.length) return 'No price'; const lo = Math.min.apply(null, ps), hi = Math.max.apply(null, ps); return lo === hi ? rp(lo) : 'from ' + rp(lo); }
  function sheetHead(title, sub) { return `<div class="sh-h"><div class="tt"><h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}</div><button target="_self" class="sh-x" aria-label="Close" onclick="closeSheet()">✕</button></div>`; }

  /* ---------- page ---------- */
  function render(d) {
    D = d;
    if (d.day) DAY = d.day;
    document.getElementById('updated').textContent = 'Items and prices from Dom\'s sheet · ' + when(d.at) + ' · today: ' + d.today;
    CART = CART.filter(l => !l.pre || (prod(l.key) || {}).preorder); saveCarts();
    drawTabs(); drawQueue(); draw();

      lines: CART.map(l => l.custom ? { custom: l.custom, price: l.price, qty: l.qty } : Object.assign({ key: l.key, colour: l.colour, fit: l.fit, size: l.size, qty: l.qty }, l.pre ? { pre: true } : { discount: l.discount || 0, reason: l.reason || '' })) };
    if (hasPre) { sale.buyer = { name: b.name.trim(), phone: b.phone.trim(), cemail: b.cemail.trim(), role: b.role }; sale.collect = PAY.collect; }
    const shown = { total: PAY.method === 'foc' ? 0 : totalOf(CART), items: CART.map(l => ({ name: (l.custom || (prod(l.key) || {}).name) + (l.pre ? ' (pre-order)' : ''), opt: optText(l), qty: l.qty, net: lineNet(l) })), by: (ME ? ME.name : '') + (sale.helper ? ' + ' + sale.helper : '') };
    ls.set('woahPosHelper', PAY.helper.trim());
    if (!hasPre) {
      QUEUE.push({ sale, shown, err: '' }); ls.set('woahPosQueue', QUEUE);
      CART = []; PAY = null; closeSheet(); cartChanged(); drawQueue();
      toast('Sale saved · ' + rp(shown.total)); sync(); return;
    }
    PAY.sid = sale.id; BUSY = true; drawCart();
    call({ action: 'posSale', sale }).then(r => {
      BUSY = false; if (r.day) DAY = r.day;
      CART = []; PAY = null; cartChanged(); SHEET = 'done';
      document.getElementById('sheet').innerHTML = sheetHead('Sale saved', 'Tell ' + esc(r.buyer || 'the buyer') + ' their pre-order number:') + `<div class="done-no">${esc(r.order || '')}</div>
        ${shown.items.map(i => `<div class="cl"><div class="ln">${i.qty} × ${esc(i.name)} <span class="o">${esc(i.opt)}</span></div><div class="pr">${rp(i.net)}</div></div>`).join('')}
        <div class="ps-note">${r.paidNow ? 'Paid in this sale.' : 'Not paid yet: they pay when they collect.'} Pre-order collect at ${esc(r.collect || '')}. It's in Shop → Orders now.</div>
        <div class="sh-f"><div class="tot">Total<b>${rp(shown.total)}</b></div><button target="_self" class="btn-main" onclick="closeSheet()">Done</button></div>`;
    }).catch(e => { BUSY = false; PAY.err = e.message; drawCart(); });
  }

  /* ---------- sending sales (works with bad wifi) ---------- */
  let SYNCING = false;
  function drawQueue() {
    const q = document.getElementById('queue'), bad = QUEUE.filter(x => x.err);
    q.className = 'ps-q' + (QUEUE.length ? ' on' : '');
    q.innerHTML = QUEUE.length ? `${QUEUE.length} sale${QUEUE.length > 1 ? 's' : ''} saved on this phone, not sent yet${bad.length ? ' · <span style="color:var(--bad)">' + esc(bad[0].err) + '</span>' : navigator.onLine ? '' : ' (no internet)'}
      <button target="_self" onclick="sync(true)">${SYNCING ? 'Sending…' : 'Send now'}</button>${bad.length ? `<button target="_self" onclick="dropBad()">Delete the one with the problem</button>` : ''}` : '';
  }
  function dropBad() {
    const i = QUEUE.findIndex(x => x.err); if (i < 0) return;
    if (!confirm('Delete this unsent sale? It will NOT be in the Sales Tracker.')) return;
    QUEUE.splice(i, 1); ls.set('woahPosQueue', QUEUE); drawQueue(); draw();
  }
  function syncSoon() { clearTimeout(syncSoon.t); syncSoon.t = setTimeout(sync, 300); }
  function sync(manual) {
    if (SYNCING || !QUEUE.length || !KEY) { drawQueue(); return; }
    SYNCING = true; drawQueue();
    const q = QUEUE[0];
    if (PHOTO.includes(q.sale.pay) && q.sale.photo === undefined) q.sale.photo = true;
    call({ action: 'posSale', sale: q.sale }).then(r => {
      QUEUE.shift(); ls.set('woahPosQueue', QUEUE); if (r.day) DAY = r.day; DAYSEL = DAY ? DAY.name : DAYSEL;
      SYNCING = false; drawQueue(); if (TAB === 'today') drawToday();
      if (QUEUE.length) sync(); else if (manual) toast('All sales sent');
    }).catch(e => {
      SYNCING = false;
      const net = e instanceof TypeError || /fetch|network|load failed/i.test(e.message || '');
      if (!net && !e.auth) q.err = e.message;
      ls.set('woahPosQueue', QUEUE); drawQueue();
      if (manual && net) toast('No connection. It will send by itself.');
    });
  }
  setInterval(() => { if (QUEUE.length && !QUEUE[0].err) sync(); }, 15000);
  window.addEventListener('online', () => sync());
  window.addEventListener('offline', drawQueue);

  /* ---------- collect shop orders (also for paying at Shanti House) ---------- */
  function loadOrders() {
    if (!ORD) document.getElementById('view').innerHTML = '<div class="card">Loading orders…</div>';
    return call({ action: 'posOrders' }).then(d => { ORD = d.orders; if (TAB === 'collect') drawCollect(); }).catch(e => { document.getElementById('view').innerHTML = `<div class="card bad">${esc(e.message)}</div>`; });
  }
  function drawCollect() {
    if (!ORD) { document.getElementById('view').innerHTML = '<div class="card">Loading orders…</div>'; return; }
    document.getElementById('view').innerHTML = `
      <div class="ps-tool"><input class="ps-in search" type="search" placeholder="Search name, order number or phone" value="${esc(OQ)}" oninput="OQ=this.value;drawCollectList()"><button target="_self" onclick="ORD=null;loadOrders()">Refresh</button></div>
      <p class="ps-note" style="margin-bottom:12px">Open orders from the website and stall pre-orders. Take the payment and/or hand the items over. Works anywhere, e.g. at Shanti House.</p>
      <div class="ps-list" id="oList"></div>`;
    drawCollectList();
  }
  function drawCollectList() {
    const q = OQ.toLowerCase().trim(), list = ORD.filter(o => !q || [o.order, o.name, o.email, o.phone].join(' ').toLowerCase().includes(q));
    document.getElementById('oList').innerHTML = list.length ? list.map(o => {
      const paid = o.paid === 'Yes', wait = o.items.some(i => i.status === 'Waiting for stock');
      return `<div class="oc"><div class="h"><div><b>${esc(o.order)}</b> · ${esc(o.name)}<div class="sub">${o.phone ? '+' + esc(o.phone) + ' · ' : ''}${esc(o.collect)}</div></div>
          <span class="pill ${o.status === 'Ready to collect' ? 'ok' : wait ? 'warn' : ''}">${esc(o.status)}</span></div>
        ${o.items.filter(i => i.status !== 'Cancelled').map(i => `<div class="it"><span>${i.qty} × ${esc(i.product)} <span class="sub">${esc(optText(i))}</span>${i.type === 'Pre-order' ? ' <span class="pill warn">pre-order</span>' : ''}</span><span>${rp(i.price * i.qty)}</span></div>`).join('')}
        <div class="ft"><b>${rp(o.total)}</b><span class="pill ${paid ? 'ok' : o.paid === 'Proof sent' ? 'warn' : 'bad'}">${paid ? 'Paid' : o.paid === 'Proof sent' ? 'Screenshot sent, check it' : 'Not paid'}</span><span class="sub">${esc(o.pay)}</span>${o.proof ? `<a href="${esc(o.proof)}">Screenshot ↗</a>` : ''}</div>
        <div class="acts"><button target="_self" class="btn-main" onclick="openCollect('${esc(o.order)}')">${paid ? 'Hand over' : 'Take payment / hand over'}</button></div></div>`;
    }).join('') : '<div class="card">No open orders here.</div>';
  }
  let COL = null;
  function openCollect(id) {
    const o = ORD.find(x => x.order === id); if (!o) return;
    const paid = o.paid === 'Yes', wait = o.items.some(i => i.status === 'Waiting for stock');
    COL = { o, take: !paid, hand: !wait, method: '', got: '', photo: false, err: '' };
    SHEET = 'collect'; drawCollectSheet(); openSheet();
  }
  function drawCollectSheet() {
    const o = COL.o, paid = o.paid === 'Yes', tot = o.total, m = COL.method;
    let box = '';
    if (COL.take && m === 'cash') { const got = Number(String(COL.got).replace(/\D/g, '')) || 0, ch = got - tot; box = `<div class="ps-lbl">Cash received (optional)</div><input class="ps-in" inputmode="numeric" value="${esc(COL.got)}" onchange="COL.got=this.value;drawCollectSheet()">${got ? `<div class="change ${ch < 0 ? 'bad' : ''}">${ch < 0 ? 'Still missing' : 'Change to give back'}<b>${rp(Math.abs(ch))}</b></div>` : ''}`; }
    if (COL.take && m === 'qris') box = `<div class="payinfo"><img src="${QRIS_IMG}" alt="WOAH QRIS"><div class="amt">${rp(tot)}</div>${photoBox(COL)}</div>`;
    if (COL.take && m === 'xendit') box = `<div class="payinfo"><img src="${XENDIT_IMG}" alt="Xendit QR"><div class="amt">${rp(tot)}</div>${photoBox(COL)}</div>`;
    if (COL.take && m === 'transfer') box = `<div class="payinfo">${D.settings.bank ? `<div class="bank">${esc(D.settings.bank)}</div>` : ''}<div class="amt">${rp(tot)}</div>${photoBox(COL)}</div>`;
    const sc = document.getElementById('sheet').scrollTop;
    document.getElementById('sheet').innerHTML = sheetHead(esc(o.order) + ' · ' + esc(o.name), esc(o.collect) + ' · ' + (paid ? 'already paid (' + esc(o.pay) + ')' : 'not paid yet'))
      + `<div class="sh-sec" style="border-top:0;margin-top:4px;padding-top:0">${o.items.filter(i => i.status !== 'Cancelled').map(i => `<div class="cl"><div class="ln">${i.qty} × ${esc(i.product)} <div class="o">${esc(optText(i))} · ${esc(i.status)}</div></div><div class="pr">${rp(i.price * i.qty)}</div></div>`).join('')}</div>
      ${paid ? '' : `<div class="sh-sec"><label class="tick"><input type="checkbox" ${COL.take ? 'checked' : ''} onchange="COL.take=this.checked;drawCollectSheet()"> Take payment now</label>
        ${COL.take ? `<div class="pays" style="margin-top:10px">${[['cash', 'Cash'], ['qris', 'QRIS'], ['xendit', 'Card (Xendit)'], ['transfer', 'Transfer']].map(([k, l]) => `<button target="_self" class="${m === k ? 'on' : ''}" onclick="COL.method='${k}';COL.photo=false;drawCollectSheet()">${l}</button>`).join('')}</div>${box}` : ''}</div>`}
      <div class="sh-sec"><label class="tick"><input type="checkbox" ${COL.hand ? 'checked' : ''} onchange="COL.hand=this.checked;drawCollectSheet()"> Hand over the items now (Collected)</label>
      ${COL.hand && o.items.some(i => i.status === 'Waiting for stock') ? '<div class="warnline">Some items are still "Waiting for stock". Only tick this if you\'re really giving them the items.</div>' : ''}</div>
      <div class="badline">${esc(COL.err)}</div>
      <div class="sh-f"><div class="tot">Total<b>${rp(tot)}</b></div><button target="_self" class="btn-main" ${BUSY ? 'disabled' : ''} onclick="doCollect()">${BUSY ? 'Saving…' : 'Confirm'}</button></div>`;
    document.getElementById('sheet').scrollTop = sc;
  }
  function doCollect(force) {
    const paid = COL.o.paid === 'Yes', take = COL.take && !paid;
    if (!take && !COL.hand) { COL.err = 'Tick "Take payment" or "Hand over".'; drawCollectSheet(); return; }
    if (take && !COL.method) { COL.err = 'Pick how they paid.'; drawCollectSheet(); return; }
    if (take && PHOTO.includes(COL.method) && !COL.photo) { COL.err = 'Take a photo of the payment with your phone and tick the box.'; drawCollectSheet(); return; }
    BUSY = true; COL.err = ''; drawCollectSheet();
    call({ action: 'posCollect', order: COL.o.order, take, pay: COL.method, photo: !!COL.photo, collect: COL.hand, force: !!force }).then(r => {
      BUSY = false; if (r.day) DAY = r.day; closeSheet();
      toast(r.order + (r.took ? ' paid' : '') + (r.took && r.handed ? ' and' : '') + (r.handed ? ' handed over' : ''));
      ORD = null; loadOrders();
    }).catch(e => {
      BUSY = false;
      if (/Hand over anyway/.test(e.message) && confirm(e.message)) return doCollect(true);
      COL.err = e.message; drawCollectSheet();
    });
  }

  /* ---------- today: sales list + end-of-day check ---------- */
  function loadDay(name) {
    return call({ action: 'posDay', day: name || '' }).then(d => { DAY = d.day; DAYS = d.days; DAYSEL = d.day ? d.day.name : (name || d.today); D.today = d.today; if (TAB === 'today') drawToday(); }).catch(e => fail(e));
  }
  function drawToday() {
    const day = DAY, admin = ME && ME.role === 'full';
    const pend = QUEUE.map(q => `<div class="oc"><div class="h"><div><b>Not sent yet</b> <span class="sub">${when(q.sale.at)}</span></div><span class="pill warn">${esc(PAY_LABEL[q.sale.pay])}</span></div>
      ${q.shown.items.map(i => `<div class="it"><span>${i.qty} × ${esc(i.name)} <span class="sub">${esc(i.opt)}</span></span><span>${rp(i.net)}</span></div>`).join('')}<div class="ft"><b>${rp(q.shown.total)}</b><span class="sub">${esc(q.shown.by)}</span>${q.err ? `<span class="pill bad">${esc(q.err)}</span>` : ''}</div></div>`).join('');
    const days = DAYS.length ? `<select class="ps-in" style="width:auto" onchange="DAYSEL=this.value;loadDay(this.value)">${(DAYS.includes(D.today) ? DAYS : [D.today].concat(DAYS)).map(n => `<option ${n === (day ? day.name : D.today) ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>` : '';
    if (!day) { document.getElementById('view').innerHTML = `<div class="ps-tool">${days}</div>${pend ? `<div class="ps-list" style="margin-bottom:12px">${pend}</div>` : ''}<div class="card">No sales yet ${DAYSEL && DAYSEL !== D.today ? 'that day' : 'today'}. The day's tab in the Sales Tracker is made with the first sale.</div>`; return; }
    const s = day.sum;
    document.getElementById('view').innerHTML = `
      <div class="ps-tool">${days}<span style="flex:1"></span><a class="pill" href="${esc(day.url)}">Open in the Sales Tracker ↗</a></div>
      <div class="ps-h">${esc(day.name)}<span class="line"></span></div>
      <div class="stats">
        <div class="stat"><b>${day.count}</b>stall sales</div><div class="stat"><b>${rp(day.paid)}</b>paid</div><div class="stat"><b>${rp(day.owed)}</b>not paid yet</div>
        ${METHODS.filter(m => s[m] && s[m].n).map(m => `<div class="stat"><b>${rp(s[m].amount)}</b>${esc(m)} · ${s[m].n}</div>`).join('')}
      </div>
      ${pend ? `<div class="ps-h">On this phone, not sent yet<span class="line"></span></div><div class="ps-list">${pend}</div>` : ''}
      <div class="ps-h">Sales <b>${day.sales.length}</b><span class="line"></span></div>
      <div class="ps-list">${day.sales.length ? day.sales.map(x => saleHTML(x, admin, day.name)).join('') : '<div class="card">No sales.</div>'}</div>
      <div class="ps-h">End-of-day check<span class="line"></span></div>
      <div class="card"><div class="sub">Count the cash box and check the QRIS / Xendit / bank apps, then type what you found. Differences show in red.</div>
        <table class="ck" style="margin-top:8px"><tr><th>Method</th><th>System says</th><th>Counted</th><th>Difference</th></tr>
        ${COUNTED.map(m => { const sys = (s[m] || {}).amount || 0, v = CK[m] != null ? CK[m] : (day.counted[m] != null ? day.counted[m] : ''); const d = v === '' ? null : Number(v) - sys;
          return `<tr><td>${esc(m)}</td><td>${rp(sys)}</td><td><input inputmode="numeric" value="${esc(v)}" oninput="CK['${m}']=this.value.replace(/\\D/g,'');drawCheckDiff()" data-m="${esc(m)}"></td><td class="diff ${d == null ? '' : d === 0 ? 'ok' : 'bad'}" id="df-${m.replace(/\W/g, '')}">${d == null ? '' : d === 0 ? 'OK' : (d > 0 ? '+' : '−') + rp(Math.abs(d))}</td></tr>`; }).join('')}
        </table>
        <div class="ps-lbl">Note (explain any difference)</div><input class="ps-in" id="ckNote" value="${esc(CK.note != null ? CK.note : day.check.note)}" oninput="CK.note=this.value">
        <div class="sub" style="margin-top:6px">${day.check.by ? 'Last checked by ' + esc(day.check.by) + (day.check.at ? ' · ' + when(day.check.at) : '') : 'Not checked yet.'}</div>
        <button target="_self" class="btn-main" style="width:100%;margin-top:12px" onclick="saveCheck()">Save the check</button></div>`;
  }
  function drawCheckDiff() {
    const s = DAY.sum;
    COUNTED.forEach(m => { const el = document.getElementById('df-' + m.replace(/\W/g, '')); if (!el) return; const v = CK[m] != null ? CK[m] : (DAY.counted[m] != null ? String(DAY.counted[m]) : '');
      const d = v === '' ? null : Number(v) - ((s[m] || {}).amount || 0); el.className = 'diff ' + (d == null ? '' : d === 0 ? 'ok' : 'bad'); el.textContent = d == null ? '' : d === 0 ? 'OK' : (d > 0 ? '+' : '−') + rp(Math.abs(d)); });
  }
  function saleHTML(x, admin, dayName) {
    const cx = x.status === 'Cancelled', mine = ME && x.by.split(' + ')[0] === ME.name;
    const kind = x.kind === 'Sale' ? '' : `<span class="pill">${esc(x.kind)} ${esc(x.sale)}</span>`;
    return `<div class="oc ${cx ? 'cx' : ''}"><div class="h"><div><b>${new Date(x.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</b> <span class="sub">${esc(x.by)}</span></div>
        <span class="pill ${x.pay === 'NOT YET PAID' ? 'bad' : x.pay === 'FOC' ? 'warn' : 'ok'}">${esc(x.pay)}</span></div>
      ${x.items.map(i => `<div class="it"><span>${i.qty} × ${esc(i.product)}${i.brand === 'SOAP' ? ' <span class="pill soap">SOAP</span>' : ''}${i.discount && x.pay !== 'FOC' ? ` <span class="sub">(−${rp(i.discount)} ${esc(i.reason)})</span>` : ''}</span><span>${rp(i.amount)}</span></div>`).join('')}
      <div class="ft"><b>${rp(x.total)}</b>${kind}${cx ? '<span class="pill bad">Cancelled</span>' : ''}${x.note ? `<span class="sub">${esc(x.note)}</span>` : ''}${x.pay === 'FOC' && x.items[0] ? `<span class="sub">${esc(x.items[0].reason)}</span>` : ''}</div>
      ${x.kind === 'Sale' ? `<div class="acts">${(mine || admin) ? `<button target="_self" onclick="voidSale('${esc(dayName)}','${esc(x.sale)}',${cx})">${cx ? 'Undo cancel' : 'Cancel sale'}</button>` : ''}
        ${admin && !cx ? `<label class="pill ${x.dom ? 'ok' : ''}" style="cursor:pointer"><input type="checkbox" ${x.dom ? 'checked' : ''} onchange="domSale('${esc(dayName)}','${esc(x.sale)}',this.checked)"> In Dom's sheet</label>` : x.dom ? '<span class="pill ok">In Dom\'s sheet</span>' : ''}</div>` : ''}</div>`;
  }
  function voidSale(day, sale, undo) {
    if (!undo && !confirm('Cancel this sale? Use this for mistakes. Its stock comes back.')) return;
    call({ action: 'posVoid', day, sale, undo }).then(r => { DAY = r.day; drawToday(); toast(undo ? 'Sale back' : 'Sale cancelled'); }).catch(e => alert(e.message));
  }
  function domSale(day, sale, on) {
    call({ action: 'posDom', day, sale, on }).then(r => { DAY = r.day; drawToday(); }).catch(e => { alert(e.message); drawToday(); });
  }
  function saveCheck() {
    const counted = {};
    COUNTED.forEach(m => { const v = CK[m] != null ? CK[m] : (DAY.counted[m] != null ? String(DAY.counted[m]) : ''); counted[m] = v === '' ? '' : Number(v); });
    const note = document.getElementById('ckNote').value;
    const bad = COUNTED.some(m => counted[m] !== '' && counted[m] !== ((DAY.sum[m] || {}).amount || 0));
    if (bad && note.trim().length < 3) { alert('There\'s a difference. Write a short note explaining it first.'); return; }
    call({ action: 'posCheck', day: DAY.name, counted, note }).then(r => { DAY = r.day; CK = {}; drawToday(); toast('Check saved'); }).catch(e => alert(e.message));
  }

  start({ title: 'Sell', need: 'handler', action: 'pos', onData: render });
</script>
</body>
</html>
